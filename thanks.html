<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/orlandis-logoprimary.png">
    <title>Thank You - Orlandi's Cleaning</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Urbanist', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #003D5A;
            background-image: url(./assets/giftcardbg-w.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 32px;
            padding: 56px 48px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0,61,90,0.18);
        }
        .logo {
            width: 90px;
            margin: 0 auto 32px;
            display: block;
        }
        .check-circle {
            width: 72px;
            height: 72px;
            background: #DCF6FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
        }
        .check-circle svg {
            width: 36px;
            height: 36px;
        }
        h1 {
            color: #003D5A;
            font-size: 32px;
            font-weight: 800;
            line-height: 110%;
            margin-bottom: 16px;
        }
        .subtitle {
            color: #003D5A;
            font-size: 16px;
            font-weight: 500;
            line-height: 160%;
            max-width: 380px;
            margin: 0 auto 12px;
        }
        .note {
            color: #00AEEF;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 36px;
        }
        .divider {
            border: none;
            border-top: 1px solid #DCF6FF;
            margin-bottom: 32px;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }
        .badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #F0FBFF;
            border: 1px solid #95E5FF;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #003D5A;
        }
        .badge svg { flex-shrink: 0; }
        .btn-home {
            display: inline-block;
            background: #003D5A;
            color: #fff;
            text-decoration: none;
            font-family: 'Urbanist', sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 50px;
            transition: background 0.15s, color 0.15s;
            letter-spacing: 0.3px;
        }
        .btn-home:hover {
            background: #95E5FF;
            color: #003D5A;
        }
        .timer-wrap {
            margin-top: 20px;
            font-size: 13px;
            color: #003D5A80;
            font-weight: 500;
        }
        .timer-wrap span {
            font-weight: 800;
            color: #003D5A;
        }
        @media (max-width: 520px) {
            .card { padding: 40px 28px 36px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="./assets/orlandis-logoprimary.png" alt="Orlandi's Cleaning" class="logo">

        <div class="check-circle">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="18" cy="18" r="18" fill="#95E5FF"/>
                <path d="M10 18.5L15.5 24L26 13" stroke="#003D5A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>Quote received!</h1>
        <p class="subtitle">Thank you for reaching out to Orlandi's Cleaning. We've received your request and will get back to you shortly.</p>

        <hr class="divider">

        <div class="badges">
            <span class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#003D5A" stroke-width="2"/>
                    <path d="M12 6v6l4 2" stroke="#003D5A" stroke-width="2" stroke-linecap="round"/>
                </svg>
                24h response
            </span>
            <span class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="#003D5A" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                5-star service
            </span>
            <span class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="#003D5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Fully insured
            </span>
        </div>

        <a href="https://orlandiscleaning.com/" class="btn-home">Back to Home</a>
        <p class="timer-wrap">Redirecting in <span id="countdown">10</span>s…</p>
    </div>
    <script>
        var s = 10;
        var el = document.getElementById('countdown');
        var t = setInterval(function () {
            s--;
            el.textContent = s;
            if (s <= 0) {
                clearInterval(t);
                window.location.href = 'https://orlandiscleaning.com/';
            }
        }, 1000);
    </script>
</body>
</html>
